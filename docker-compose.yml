services:
  document-parser:
    build:
      context: .
    ports:
      - "8501:8501"
    environment:
      MAX_FILE_SIZE_MB: "100"
      ALLOW_LOCAL_PATH_INPUT_IN_UI: "false"
      ALLOW_PRIVATE_NETWORK_URLS: "false"
      LOG_LEVEL: "INFO"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
